<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Producao</title>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = { darkMode: 'class' };
        (function() {
            const GLOBAL_THEME_KEY = 'po-theme-global';
            const savedTheme = localStorage.getItem(GLOBAL_THEME_KEY);
            const preferredTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.classList.toggle('dark', preferredTheme === 'dark');
            document.documentElement.style.colorScheme = preferredTheme;
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 28%),
                radial-gradient(circle at top right, rgba(16, 185, 129, 0.08), transparent 24%),
                linear-gradient(180deg, #f8fafc 0%, #eef4ff 100%);
        }

        .dark body {
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 24%),
                radial-gradient(circle at top right, rgba(34, 197, 94, 0.08), transparent 20%),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
        }

        .kanban-col::-webkit-scrollbar,
        .orders-list::-webkit-scrollbar,
        .calendar-aside-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .kanban-col::-webkit-scrollbar-track,
        .orders-list::-webkit-scrollbar-track,
        .calendar-aside-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .kanban-col::-webkit-scrollbar-thumb,
        .orders-list::-webkit-scrollbar-thumb,
        .calendar-aside-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 999px;
        }

        .dark .kanban-col::-webkit-scrollbar-thumb,
        .dark .orders-list::-webkit-scrollbar-thumb,
        .dark .calendar-aside-list::-webkit-scrollbar-thumb {
            background-color: #475569;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            border-color: rgba(71, 85, 105, 0.45);
            box-shadow: 0 18px 60px rgba(2, 6, 23, 0.45);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 10px;
        }

        .dashboard-shell {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.9)),
                radial-gradient(circle at top, rgba(96, 165, 250, 0.12), transparent 40%);
        }

        .dark .dashboard-shell {
            background:
                linear-gradient(180deg, rgba(2, 6, 23, 0.9), rgba(15, 23, 42, 0.95)),
                radial-gradient(circle at top, rgba(14, 165, 233, 0.14), transparent 38%);
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Main App Container -->
    <div id="app" class="flex-1 flex flex-col min-h-screen w-full">
        <!-- Renders dynamically based on state -->
        <div class="flex items-center justify-center h-full">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modal-root"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Initialization ---
        const firebaseConfig = {
            apiKey: "AIzaSyA4r7Qmp_Gw0zBcbcl8NIh6rnkhdVtbSUI",
            authDomain: "po-for-mom.firebaseapp.com",
            projectId: "po-for-mom",
            storageBucket: "po-for-mom.firebasestorage.app",
            messagingSenderId: "613783019650",
            appId: "1:613783019650:web:9bb9c7e2009ddd6dac149b",
            measurementId: "G-H4CF6VKQ93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'po-for-mom';
        const GLOBAL_THEME_KEY = 'po-theme-global';
        const USER_THEME_PREFIX = 'po-theme-user:';

        function readStoredTheme(username = '') {
            const normalized = username ? username.trim().toLowerCase() : '';
            const userTheme = normalized ? localStorage.getItem(`${USER_THEME_PREFIX}${normalized}`) : null;
            return userTheme || localStorage.getItem(GLOBAL_THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function applyTheme(theme) {
            const resolved = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', resolved === 'dark');
            document.documentElement.style.colorScheme = resolved;
            return resolved;
        }

        function saveThemePreference(theme, username = '') {
            const resolved = applyTheme(theme);
            localStorage.setItem(GLOBAL_THEME_KEY, resolved);
            const normalized = username ? username.trim().toLowerCase() : '';
            if (normalized) {
                localStorage.setItem(`${USER_THEME_PREFIX}${normalized}`, resolved);
            }
            return resolved;
        }

        // --- App State ---
        let state = {
            isLoaded: false,
            firebaseUser: null,
            appUser: null, // { username, role, id }
            users: [],
            pos: [],
            history: [],
            searchQuery: '',
            orderSearchQuery: '',
            orderSearchScope: 'all',
            expandedOrders: [],
            theme: readStoredTheme(),
            currentView: 'board', // 'board' or 'archived'
            calendarDate: new Date()
        };

        const stages = [
            { id: 'art', name: 'Arte', color: 'bg-blue-100 text-blue-800 border-blue-200', dot: 'bg-blue-500' },
            { id: 'printing', name: 'Impressao', color: 'bg-purple-100 text-purple-800 border-purple-200', dot: 'bg-purple-500' },
            { id: 'cutting', name: 'Corte', color: 'bg-yellow-100 text-yellow-800 border-yellow-200', dot: 'bg-yellow-500' },
            { id: 'sewing', name: 'Costura', color: 'bg-orange-100 text-orange-800 border-orange-200', dot: 'bg-orange-500' },
            { id: 'packaging', name: 'Embalagem', color: 'bg-teal-100 text-teal-800 border-teal-200', dot: 'bg-teal-500' },
            { id: 'delivery', name: 'Pronto/Entrega', color: 'bg-green-100 text-green-800 border-green-200', dot: 'bg-green-500' }
        ];

        // --- Core Functions ---
        
        function setState(updates) {
            state = { ...state, ...updates };
            if (updates.theme) applyTheme(updates.theme);
            render();
        }

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
                alert("Falha na autenticacao. Verifique o console.");
            }
        };

        function getRoleLabel(role) {
            if (role === 'admin') return 'Administrador';
            if (role === 'employee') return 'Funcionario';
            return role;
        }

        function formatDateForDisplay(dateString) {
            if (!dateString) return '';
            const date = new Date(`${dateString}T00:00:00`);
            return Number.isNaN(date.getTime()) ? dateString : date.toLocaleDateString('pt-BR');
        }

        function formatDateTimeForDisplay(timestamp) {
            return new Date(timestamp).toLocaleString('pt-BR');
        }

        function getDaysUntil(dateString) {
            if (!dateString) return null;
            const today = new Date();
            const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const end = new Date(`${dateString}T00:00:00`);
            if (Number.isNaN(end.getTime())) return null;
            return Math.ceil((end - start) / (1000 * 60 * 60 * 24));
        }

        function getDeadlineLabel(po) {
            if (!po.dateRangeEnd) return 'Sem prazo';
            const daysUntil = getDaysUntil(po.dateRangeEnd);
            if (daysUntil === null) return formatDateForDisplay(po.dateRangeEnd);
            if (daysUntil < 0) return `${Math.abs(daysUntil)} dia(s) atrasado`;
            if (daysUntil === 0) return 'Entrega hoje';
            if (daysUntil === 1) return 'Entrega amanha';
            return `Entrega em ${daysUntil} dias`;
        }

        function getStageMeta(stageId) {
            return stages.find(stage => stage.id === stageId) || stages[0];
        }

        function getActivePOs() {
            return state.pos.filter(po => !po.archived);
        }

        function getArchivedPOs() {
            return state.pos.filter(po => po.archived);
        }

        function getBoardSearchPOs() {
            return getActivePOs().filter(po => matchSearch(po));
        }

        function getPOStageCount(stageId) {
            return getActivePOs().filter(po => po.stage === stageId).length;
        }

        function getUrgentPOs() {
            return getActivePOs().filter(po => {
                const daysUntil = getDaysUntil(po.dateRangeEnd);
                return daysUntil !== null && daysUntil <= 3;
            }).length;
        }

        function matchOrderSearch(po) {
            if (!state.orderSearchQuery) return true;
            const terms = state.orderSearchQuery.toLowerCase().split(/\s+/).filter(Boolean);
            const searchableText = [
                po.title,
                po.description || '',
                po.itemType || '',
                po.notes || '',
                po.clothType || '',
                po.stage || '',
                po.archived ? 'arquivado inativo concluido' : 'ativo andamento',
                po.paymentFinished ? 'pago concluido' : 'pendente'
            ].join(' ').toLowerCase();
            return terms.every(term => searchableText.includes(term));
        }

        function getVisibleOrdersForExplorer() {
            return state.pos
                .filter(po => {
                    if (state.orderSearchScope === 'active') return !po.archived;
                    if (state.orderSearchScope === 'archived') return po.archived;
                    return true;
                })
                .filter(matchOrderSearch)
                .sort((a, b) => {
                    const aDate = a.dateRangeEnd || '9999-12-31';
                    const bDate = b.dateRangeEnd || '9999-12-31';
                    if (a.archived !== b.archived) return Number(a.archived) - Number(b.archived);
                    return aDate.localeCompare(bDate) || (b.updatedAt || 0) - (a.updatedAt || 0);
                });
        }

        function isOrderExpanded(orderId) {
            return state.expandedOrders.includes(orderId);
        }

        function toggleOrderExpanded(orderId) {
            const expandedOrders = isOrderExpanded(orderId)
                ? state.expandedOrders.filter(id => id !== orderId)
                : [...state.expandedOrders, orderId];
            setState({ expandedOrders });
        }

        // Initialize App
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                setState({ firebaseUser: user });
                setupListeners();
            } else {
                setState({ firebaseUser: null, isLoaded: true });
            }
        });

        let unsubUsers, unsubPos, unsubHistory;

        function setupListeners() {
            if (!state.firebaseUser) return;

            const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'app_users');
            unsubUsers = onSnapshot(usersRef, (snapshot) => {
                const users = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setState({ users, isLoaded: true });
            }, (err) => console.error(err));

            const posRef = collection(db, 'artifacts', appId, 'public', 'data', 'pos');
            unsubPos = onSnapshot(posRef, (snapshot) => {
                const pos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setState({ pos });
            }, (err) => console.error(err));

            const historyRef = collection(db, 'artifacts', appId, 'public', 'data', 'history');
            unsubHistory = onSnapshot(historyRef, (snapshot) => {
                const history = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sort history locally (No complex Firebase queries)
                history.sort((a, b) => b.timestamp - a.timestamp);
                setState({ history });
            }, (err) => console.error(err));
        }

        // --- Database Actions ---

        async function logHistory(action, details, poName = "") {
            if (!state.appUser) return;
            const historyId = Date.now().toString() + Math.random().toString(36).substr(2, 5);
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'history', historyId);
            await setDoc(ref, {
                timestamp: Date.now(),
                user: state.appUser.username,
                role: state.appUser.role,
                action,
                details,
                poName
            });
        }

        async function savePO(poData, isNew = false) {
            const id = isNew ? Date.now().toString() : poData.id;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'pos', id);
            
            const payload = {
                ...poData,
                id,
                updatedAt: Date.now()
            };
            if (isNew) payload.createdAt = Date.now();

            await setDoc(ref, payload);
            
            logHistory(
                isNew ? "Pedido criado" : "Pedido atualizado", 
                isNew ? `Criou novo pedido: ${poData.title}` : `Atualizou os detalhes de ${poData.title}`,
                poData.title
            );
            closeModal();
        }

        async function updatePOStage(poId, newStage) {
            const po = state.pos.find(p => p.id === poId);
            if (!po) return;

            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'pos', poId);
            await setDoc(ref, { ...po, stage: newStage, updatedAt: Date.now() });
            
            const stageName = stages.find(s => s.id === newStage)?.name || newStage;
            logHistory("Pedido movido", `Moveu para ${stageName}`, po.title);
        }

        async function toggleArchive(poId, archiveStatus) {
            const po = state.pos.find(p => p.id === poId);
            if (!po) return;

            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'pos', poId);
            await setDoc(ref, { ...po, archived: archiveStatus, updatedAt: Date.now() });
            
            logHistory(archiveStatus ? "Pedido arquivado" : "Pedido restaurado", archiveStatus ? "Marcado como concluido e arquivado" : "Restaurado do arquivo", po.title);
        }

        async function updatePaymentStatus(poId, isPaid) {
            const po = state.pos.find(p => p.id === poId);
            if (!po) return;

            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'pos', poId);
            await setDoc(ref, { ...po, paymentFinished: isPaid, updatedAt: Date.now() });
            
            logHistory("Pagamento atualizado", `Marcou o pagamento como ${isPaid ? 'Concluido' : 'Pendente'}`, po.title);
        }

        // --- Auth Actions ---

        async function handleLogin(username, password) {
            username = username.trim().toLowerCase();
            
            // Check if users exist at all. If not, make first user Admin
            if (state.users.length === 0) {
                const newUserId = Date.now().toString();
                const newUser = { id: newUserId, username, password, role: 'admin' };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', newUserId), newUser);
                setState({ appUser: newUser, theme: readStoredTheme(username) });
                return;
            }

            const user = state.users.find(u => u.username === username && u.password === password);
            if (user) {
                setState({ appUser: user, theme: readStoredTheme(user.username) });
            } else {
                // If username doesn't exist, create as employee (Simple creation flow as requested)
                const exists = state.users.find(u => u.username === username);
                if (!exists) {
                    const newUserId = Date.now().toString();
                    const newUser = { id: newUserId, username, password, role: 'employee' };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'app_users', newUserId), newUser);
                    setState({ appUser: newUser, theme: readStoredTheme(username) });
                } else {
                    alert("Senha incorreta.");
                }
            }
        }

        function toggleTheme() {
            const nextTheme = state.theme === 'dark' ? 'light' : 'dark';
            const savedTheme = saveThemePreference(nextTheme, state.appUser?.username || '');
            setState({ theme: savedTheme });
        }

        function handleLogout() {
            setState({
                appUser: null,
                currentView: 'board',
                searchQuery: '',
                orderSearchQuery: '',
                orderSearchScope: 'all',
                expandedOrders: [],
                theme: readStoredTheme()
            });
        }


        // --- UI Renderers ---

        function render() {
            const appDiv = document.getElementById('app');
            if (!state.isLoaded) return; // Keeps loading spinner

            if (!state.appUser) {
                appDiv.innerHTML = getLoginHTML();
            } else {
                appDiv.innerHTML = getDashboardHTML();
                renderCalendar();
            }
            lucide.createIcons();
            attachGlobalListeners();
        }

        function getLegacyLoginHTML() {
            return `
                <div class="flex items-center justify-center h-full w-full bg-slate-100 dark:bg-slate-800">
                    <div class="bg-white dark:bg-slate-900 p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200 dark:border-slate-700">
                        <div class="flex justify-center mb-6 text-blue-600 dark:text-blue-400">
                            <i data-lucide="layout-dashboard" class="w-12 h-12"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-center mb-2 text-slate-800 dark:text-white">Controle de Producao</h1>
                        <p class="text-center text-slate-500 dark:text-slate-400 mb-6 text-sm">
                            ${state.users.length === 0 ? "O primeiro login vira administrador." : "Digite usuario e senha."}
                        </p>
                        
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Usuario</label>
                                <input type="text" id="login-user" required class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" placeholder="ex.: erika">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Senha</label>
                                <input type="password" id="login-pass" required class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition-colors">
                                Entrar
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function getLoginHTML() {
            return `
                <div class="min-h-screen w-full flex items-center justify-center px-4 py-10">
                    <div class="w-full max-w-6xl grid lg:grid-cols-[1.15fr_0.85fr] gap-6 items-stretch">
                        <div class="glass-panel rounded-[32px] p-8 md:p-10 flex flex-col justify-between overflow-hidden relative">
                            <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_top_left,rgba(14,165,233,0.16),transparent_32%),radial-gradient(circle_at_bottom_right,rgba(16,185,129,0.12),transparent_26%)] dark:bg-[radial-gradient(circle_at_top_left,rgba(56,189,248,0.12),transparent_28%),radial-gradient(circle_at_bottom_right,rgba(34,197,94,0.1),transparent_24%)]"></div>
                            <div class="relative">
                                <div class="flex items-center justify-between gap-4 mb-8">
                                    <div class="inline-flex items-center gap-3">
                                        <div class="bg-slate-900 dark:bg-sky-500 text-white p-3 rounded-2xl shadow-lg">
                                            <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold uppercase tracking-[0.25em] text-sky-700 dark:text-sky-300">Controle interno</p>
                                            <h1 class="text-xl md:text-2xl font-black text-slate-900 dark:text-white">Producao sem ruido</h1>
                                        </div>
                                    </div>
                                    <button id="btn-theme-toggle" class="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-100 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                        <i data-lucide="${state.theme === 'dark' ? 'sun-medium' : 'moon-star'}" class="w-4 h-4"></i>
                                        <span class="text-sm font-semibold">${state.theme === 'dark' ? 'Modo claro' : 'Modo escuro'}</span>
                                    </button>
                                </div>

                                <div class="space-y-6">
                                    <div>
                                        <p class="text-sm font-bold uppercase tracking-[0.25em] text-slate-700 dark:text-slate-400">Painel da oficina</p>
                                        <h2 class="mt-3 text-4xl md:text-5xl font-black tracking-tight text-slate-900 dark:text-white">Entrar e continuar exatamente no tema certo.</h2>
                                        <p class="mt-4 text-base md:text-lg text-slate-600 dark:text-slate-300 max-w-2xl">O tema agora fica consistente entre login e painel, e a preferencia pode ser salva por usuario no navegador.</p>
                                    </div>

                                    <div class="grid sm:grid-cols-3 gap-3">
                                        <div class="rounded-2xl bg-white dark:bg-slate-900/70 border border-slate-300 dark:border-slate-700 p-4 shadow-sm dark:shadow-none">
                                            <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-700 dark:text-slate-400">Fluxo</p>
                                            <p class="text-2xl font-black text-slate-900 dark:text-white mt-2">1 painel</p>
                                            <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">Login, quadro, calendario e lista completa com a mesma identidade.</p>
                                        </div>
                                        <div class="rounded-2xl bg-white dark:bg-slate-900/70 border border-slate-300 dark:border-slate-700 p-4 shadow-sm dark:shadow-none">
                                            <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-700 dark:text-slate-400">Tema</p>
                                            <p class="text-2xl font-black text-slate-900 dark:text-white mt-2">${state.theme === 'dark' ? 'Escuro' : 'Claro'}</p>
                                            <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">Persistido no navegador e reaplicado antes de renderizar.</p>
                                        </div>
                                        <div class="rounded-2xl bg-white dark:bg-slate-900/70 border border-slate-300 dark:border-slate-700 p-4 shadow-sm dark:shadow-none">
                                            <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-700 dark:text-slate-400">Acesso</p>
                                            <p class="text-2xl font-black text-slate-900 dark:text-white mt-2">${state.users.length}</p>
                                            <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">${state.users.length === 0 ? "Primeiro acesso cria o administrador." : "Usuarios salvos prontos para entrar."}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="relative mt-8 flex flex-wrap gap-2 text-xs font-semibold text-slate-700 dark:text-slate-400">

        // --- Filtering & Logic Helpers ---
        function matchSearch(po) {
            if (!state.searchQuery) return true;
            const terms = state.searchQuery.toLowerCase().split(/\s+/);
            const searchableText = `${po.title} ${po.description || ''} ${po.itemType} ${po.notes || ''}`.toLowerCase();
            // All terms must be present somewhere (allows "erika fogueira" to match "Erika - Festa Fogueira")
            return terms.every(term => searchableText.includes(term));
        }

        function getWarnings(po) {
            const warnings = [];
            const now = new Date();
            
            // Un-updated warning (3 days)
            const daysSinceUpdate = (now - new Date(po.updatedAt || po.createdAt)) / (1000 * 60 * 60 * 24);
            if (daysSinceUpdate > 3 && po.stage !== 'delivery') {
                warnings.push({ text: 'Sem atualizacao ha mais de 3 dias', type: 'idle' });
            }

            // Deadline approaching (3 days) or overdue
            if (po.dateRangeEnd && po.stage !== 'delivery') {
                const end = new Date(po.dateRangeEnd);
                const diffDays = (end - now) / (1000 * 60 * 60 * 24);
                if (diffDays < 0) {
                    warnings.push({ text: 'Atrasado!', type: 'danger' });
                } else if (diffDays <= 3) {
                    warnings.push({ text: 'Prazo se aproximando', type: 'warning' });
                }
            }
            return warnings;
        }

        function getKanbanHTML() {
            const activePOs = getBoardSearchPOs();
            
            let html = `<div class="overflow-x-auto pb-3"><div class="flex gap-4 min-w-max snap-x">`;
            
            stages.forEach(stage => {
                const stagePOs = activePOs.filter(p => p.stage === stage.id);
                
                html += `
                    <div class="flex flex-col min-w-[320px] max-w-[320px] h-[620px] bg-white dark:bg-slate-900/85 rounded-3xl border border-slate-300 dark:border-slate-700 shadow-sm shrink-0 snap-start overflow-hidden">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-950/70">
                            <h2 class="font-bold flex items-center gap-2 text-sm text-slate-900 dark:text-white">
                                <span class="w-3 h-3 rounded-full ${stage.dot}"></span>
                                ${stage.name}
                            </h2>
                            <span class="text-xs font-bold bg-slate-900 px-2.5 py-1 rounded-full text-white">
                                ${stagePOs.length}
                            </span>
                        </div>
                        <div class="flex-1 overflow-y-auto p-3 kanban-col space-y-3 bg-slate-50/70 dark:bg-slate-950/40">
                            ${stagePOs.map(po => getPOCardHTML(po, stage)).join('')}
                            ${stagePOs.length === 0 ? `<div class="text-center text-slate-400 text-sm mt-8 italic">Nenhum item nesta etapa</div>` : ''}
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        function getArchiveHTML() {
            const archivedPOs = getArchivedPOs().filter(po => matchSearch(po));
            
            return `
                <div>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        ${archivedPOs.length ? archivedPOs.map(po => getPOCardHTML(po, null, true)).join('') : '<p class="text-slate-600 dark:text-slate-300">Nenhum pedido arquivado encontrado.</p>'}
                    </div>
                </div>
            `;
        }

        function getPOCardHTML(po, currentStage = null, isArchive = false) {
            const warnings = getWarnings(po);
            const isAdmin = state.appUser?.role === 'admin';
            const stageMeta = getStageMeta(po.stage);
            
            let warnHtml = warnings.map(w => {
                let color = w.type === 'danger' ? 'bg-red-100 text-red-700 border-red-200' : 
                           (w.type === 'warning' ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : 'bg-orange-100 text-orange-800 border-orange-200');
                return `<span class="text-[10px] font-bold px-2 py-0.5 rounded border ${color} inline-flex items-center gap-1 mb-1 shadow-sm"><i data-lucide="alert-circle" class="w-3 h-3"></i> ${w.text}</span>`;
            }).join('');

            // Format dates neatly
            const dateStr = po.dateRangeStart && po.dateRangeEnd 
                ? `${formatDateForDisplay(po.dateRangeStart)} ate ${formatDateForDisplay(po.dateRangeEnd)}` 
                : (po.dateRangeEnd ? `Prazo: ${formatDateForDisplay(po.dateRangeEnd)}` : 'Sem prazo');

            return `
                <div class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-2xl shadow-sm hover:shadow-md transition-shadow p-3.5 cursor-pointer group relative po-card-clickable" data-id="${po.id}">
                    <div class="flex justify-between items-start gap-3 mb-3">

                                </span>

                            </div>

                        </div>
                    </div>
                    
                    <div class="flex flex-wrap gap-1 mb-2 min-h-[1.5rem]">
                        ${warnHtml}
                    </div>

                    <div class="grid grid-cols-1 gap-2 text-xs text-slate-700 dark:text-slate-300 space-y-0 mb-3">
                        <p class="flex items-center gap-1"><i data-lucide="box" class="w-3 h-3"></i> ${po.quantity}x ${po.itemType}</p>
                        <p class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${dateStr}</p>
                        <p class="flex items-center gap-1 font-semibold ${getDaysUntil(po.dateRangeEnd) !== null && getDaysUntil(po.dateRangeEnd) < 0 ? 'text-rose-600' : 'text-slate-800 dark:text-slate-100'}"><i data-lucide="alarm-clock" class="w-3 h-3"></i> ${getDeadlineLabel(po)}</p>
                    </div>

                    ${po.stage === 'delivery' ? `
                        <div class="mb-3 pt-2 border-t border-slate-200 dark:border-slate-700">
                            <span class="text-xs font-bold flex items-center gap-1 ${po.paymentFinished ? 'text-green-600' : 'text-red-500'}">
                                <i data-lucide="${po.paymentFinished ? 'check-circle' : 'circle-dashed'}" class="w-3 h-3"></i> 
                                Pagamento: ${po.paymentFinished ? 'Concluido' : 'Pendente'}
                            </span>
                        </div>
                    ` : ''}

                    <div class="flex gap-1 border-t border-slate-200 dark:border-slate-700 pt-2" onclick="event.stopPropagation()">
                        ${!isArchive ? `
                            <select class="stage-selector bg-slate-50 dark:bg-slate-800 text-xs border border-slate-300 dark:border-slate-600 rounded-xl px-2 py-2 w-full text-slate-800 dark:text-slate-100 outline-none" data-id="${po.id}">
                                ${stages.map(s => `<option value="${s.id}" ${po.stage === s.id ? 'selected' : ''}>Mover para: ${s.name}</option>`).join('')}
                            </select>

        // --- Calendar Logic ---
        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            const summaryContainer = document.getElementById('calendar-summary-container');
            const monthLabel = document.getElementById('cal-month-label');
            if (!container || !summaryContainer || !monthLabel) return;

            const d = state.calendarDate;
            const year = d.getFullYear();
            const month = d.getMonth();
            
            const monthNames = ["Janeiro", "Fevereiro", "Marco", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            monthLabel.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = `<div class="space-y-3"><div class="calendar-grid">`;
            
            // Days of week header
            const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'];
            days.forEach(day => {
                html += `<div class="text-center text-[10px] font-bold text-slate-400 uppercase py-1">${day}</div>`;
            });

            // Blanks
            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            // Days
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const currentDateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                
                // Find POs due on this day
                const duePOs = state.pos.filter(po => !po.archived && po.dateRangeEnd === currentDateStr);
                
                const hasDuePOs = duePOs.length > 0;
                const sortedDayPOs = duePOs.sort((a, b) => {
                    const stageA = stages.findIndex(s => s.id === a.stage);
                    const stageB = stages.findIndex(s => s.id === b.stage);
                    return stageA - stageB;
                });
                const previewHtml = sortedDayPOs.slice(0, 2).map(po => {
                    const stageColor = stages.find(s => s.id === po.stage)?.dot || 'bg-slate-500';
                    return `<div class="truncate flex items-center gap-1"><span class="w-2 h-2 rounded-full ${stageColor} shrink-0"></span><span class="truncate">${po.title}</span></div>`;
                }).join('');

                html += `
                    <div class="min-h-[116px] rounded-2xl border ${hasDuePOs ? 'border-sky-200 dark:border-sky-700 bg-sky-50/60 dark:bg-sky-950/30' : 'border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900'} p-2.5 flex flex-col ${isToday ? 'ring-2 ring-sky-500 ring-offset-2 ring-offset-white dark:ring-offset-slate-900' : ''}">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm ${isToday ? 'font-black text-sky-700 dark:text-sky-300' : 'font-bold text-slate-800 dark:text-slate-100'}">${day}</span>
                            ${hasDuePOs ? `<span class="text-[10px] font-bold px-2 py-1 rounded-full bg-slate-900 text-white">${duePOs.length}</span>` : ''}
                        </div>
                        <div class="text-[11px] text-slate-700 dark:text-slate-300 space-y-1">

        function openHistoryModal() {
            const html = `
                <div id="overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">

        function closeModal() {
            document.getElementById('modal-root').innerHTML = '';
        }

        // --- Event Listeners ---

        let globalListenersBound = false;

        function attachGlobalListeners() {
            if (globalListenersBound) return;
            globalListenersBound = true;

            document.body.addEventListener('click', (e) => {
                const target = e.target;
                
                // PO Card Click (Edit)
                const card = target.closest('.po-card-clickable');
                if (card && !target.closest('select') && !target.closest('.btn-restore') && !target.closest('.open-order-modal')) {
                    const po = state.pos.find(p => p.id === card.dataset.id);
                    if(po) openPOModal(po);
                }

                if (target.closest('.open-order-modal')) {
                    const id = target.closest('.open-order-modal').dataset.id;
                    const po = state.pos.find(p => p.id === id);
                    if (po) openPOModal(po);
                }

                if (target.closest('.order-expand-toggle')) {
                    const id = target.closest('.order-expand-toggle').dataset.id;
                    toggleOrderExpanded(id);
                    return;
                }

                if (target.closest('.order-scope-btn')) {
                    const scope = target.closest('.order-scope-btn').dataset.scope;
                    setState({ orderSearchScope: scope });
                    return;
                }

                // Buttons
                if (target.closest('#btn-theme-toggle')) toggleTheme();
                if (target.closest('#btn-new-po')) openPOModal();
                if (target.closest('#btn-history')) openHistoryModal();
                if (target.closest('#btn-toggle-view')) setState({ currentView: state.currentView === 'board' ? 'archived' : 'board' });
                if (target.closest('#btn-logout')) handleLogout();
                
                // Calendar Nav
                if (target.closest('#cal-prev')) {
                    const d = new Date(state.calendarDate); d.setMonth(d.getMonth() - 1); setState({ calendarDate: d });
                }
                if (target.closest('#cal-next')) {
                    const d = new Date(state.calendarDate); d.setMonth(d.getMonth() + 1); setState({ calendarDate: d });
                }

                // Restore
                if (target.closest('.btn-restore')) {
                    const id = target.closest('.btn-restore').dataset.id;
                    toggleArchive(id, false);
                }
            });

            document.body.addEventListener('change', (e) => {
                const target = e.target;
                // Stage Selection
                if (target.classList.contains('stage-selector')) {
                    updatePOStage(target.dataset.id, target.value);
                }
            });

            document.body.addEventListener('input', (e) => {
                if (e.target.id === 'search-input') {
                    setState({ searchQuery: e.target.value });
                }
                if (e.target.id === 'orders-search-input') {
                    setState({ orderSearchQuery: e.target.value });
                }
            });

            document.body.addEventListener('submit', (e) => {
                if (e.target.id === 'login-form') {
                    e.preventDefault();
                    handleLogin(document.getElementById('login-user').value, document.getElementById('login-pass').value);
                }
            });
        }
    </script>
</body>
</html>
